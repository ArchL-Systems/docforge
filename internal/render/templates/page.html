<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · DocForge</title>
  <style>{{.Style}}</style>
</head>
<body>
  <nav aria-label="Documentação">
    <strong>DocForge</strong>
    <ul>
      {{range .Links}}
      <li><a href="{{.URL}}">{{.Title}}</a></li>
      {{end}}
    </ul>
  </nav>
  <main>{{.Content}}</main>
</body>
</html>
