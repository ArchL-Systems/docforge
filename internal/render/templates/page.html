<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · DocForge</title>
  <style>{{.Style}}</style>
</head>
<body>
  <nav aria-label="Documentação">
    <strong><a href="{{.Home}}">DocForge</a></strong>
    {{range .Groups}}
    <section>
      {{if .Name}}<h2>{{if .URL}}<a href="{{.URL}}"{{if .Current}} aria-current="page"{{end}}>{{.Name}}</a>{{else}}{{.Name}}{{end}}</h2>{{end}}
      <ul>
        {{range .Links}}
        <li><a href="{{.URL}}"{{if .Current}} aria-current="page"{{end}}>{{.Title}}</a></li>
        {{end}}
      </ul>
    </section>
    {{end}}
  </nav>
  <main>
    {{if .Source}}<p class="source">{{.Source}}</p>{{end}}
    {{.Content}}
  </main>
</body>
</html>
