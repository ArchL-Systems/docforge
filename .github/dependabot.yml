version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    base-branch: development
    reviewers:
      - "PedrFelip"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    base-branch: development
    reviewers:
      - "PedrFelip"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
